[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lab-automation"
version = "0.1.0"
description = "Laboratory Raman/PL automation CLI"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0.1",
  "pyserial>=3.5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
# Pillow-backed imaging: nncam wafer capture (lab_auto.devices.nncam_camera) and
# decoding the delivered recognition masks (lab_auto.vision.recognition). Both
# import PIL lazily; install this extra on the lab/inference machine. The nncam
# binding itself is vendored (nncamsdk.../python), not a pip package.
recognition = [
  "pillow",
]

[project.scripts]
ramanctl = "lab_auto.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
