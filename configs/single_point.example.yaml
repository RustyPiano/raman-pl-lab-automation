devices_config: configs/devices.example.yaml

sample:
  id: sample-001
  operator: lab

optics:
  entrance_port: side
  exit_port: direct
  grating: 1  # Zolix turret per lab SOP: 1=1800 g/mm, 2=600 g/mm, 3=150 g/mm
  center_wavelength_nm: 600
  slit_width_um: 100
  # Operator-measured conditions for reproducibility; null means not recorded.
  excitation_wavelength_nm: null
  laser_power_mw: null

acquisition:
  exposure_ms: 1000
  gain: low
  read_mode: fvb
  frames: 1
  subtract_background: true

output:
  directory: output/measurements
